name: Sincronizar Documentacao Databricks

on:
  schedule:
    - cron: '0 3 * * 0' # Todo domingo as 03:00 UTC
  workflow_dispatch:     # Permite disparar manualmente pelo painel do GitHub

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Descompactar banco vetorial existente (se houver)
        run: |
          if [ -f "chroma_db.tar.gz" ]; then
            echo "Descompactando chroma_db.tar.gz existente..."
            tar -xzf chroma_db.tar.gz
          fi

      - name: Executar Pipeline de Ingestao Incremental
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python src/ingest_pipeline.py --max-pages 50

      - name: Compactar banco vetorial atualizado
        run: |
          if [ -d "chroma_db" ]; then
            echo "Compactando banco vetorial atualizado..."
            tar -czf chroma_db.tar.gz chroma_db/
          fi

      - name: Salvar atualizacoes no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ingestion_state.json chroma_db.tar.gz
          if git diff --staged --quiet; then
            echo "Nenhuma alteracao detectada na documentacao. Nada a salvar."
          else
            git commit -m "chore: atualizar base de conhecimento Databricks [skip ci]"
            git push
          fi
